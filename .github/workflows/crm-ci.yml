name: crm-ci

on:
  pull_request:
  push:
    branches:
      - work
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Taskboard, typecheck, lint, release guards
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Taskboard gate
        run: bash scripts/check-taskboard.sh

      - name: Route file gate
        run: npm run check:route-files

      - name: Schema reference gate
        run: npm run check:schema-refs

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Supabase boundary gate
        run: npm run check:supabase-boundaries

      - name: Database static regression gate
        run: npm run check:db-static

      - name: Repository tests
        run: npm test

      - name: Production build smoke
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
  SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          NEXT_PUBLIC_SENTRY_DSN: ''
        run: npm run build
