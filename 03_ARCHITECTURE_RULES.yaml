# CRM v3 — Architecture Rules
# 执行器（Codex/GLM CP）必须遵守的显式约束
# 散落在万字文档里的核心规则，这里集中声明
# 版本: v1.3 — 新增 rule_011 架构权威控制（Architecture Source Control）

---
rules:

  # ─── 数据库不变性 ───

  - id: rule_001
    title: "follow_up_logs 只追加，不可修改"
    description: "follow_up_logs 是历史记录，创建后 immutable。不允许 UPDATE 或 DELETE。"
    scope: database
    enforcement:
      sql: |
        -- 禁止 UPDATE
        CREATE POLICY follow_up_logs_no_update
          ON follow_up_logs FOR UPDATE USING (false);
        -- 禁止 DELETE
        CREATE POLICY follow_up_logs_no_delete
          ON follow_up_logs FOR DELETE USING (false);
    depends_on: []

  - id: rule_002
    title: "tasks 只包含未来待办"
    description: "tasks.due_at 必须 > now()。过往的跟进行为走 follow_up_logs。"
    scope: database
    enforcement:
      sql: |
        ALTER TABLE tasks ADD CONSTRAINT tasks_future_only
          CHECK (due_at > now());
    depends_on: []
    notes: "历史跟进记录从 follow_up_logs 查询，tasks 是待办队列"

  - id: rule_003
    title: "profiles.id 为唯一用户引用"
    description: "所有 FK 指向 profiles.id，不走 auth.users。auth.users 由 Supabase Auth 管理，删除用户不影响业务数据。"
    scope: database
    affected_tables:
      - lead_milestones.completed_by
      - tasks.assignee_id
      - leads.assigned_to
      - leads.sales_id
      - lead_documents.uploaded_by
      - user_features.user_id
    enforcement:
      sql: "REFERENCES profiles(id) ON DELETE SET NULL"
    depends_on: []
    notes: "若 profiles 中无对应记录，INSERT 前须先 INSERT profiles"

  # ─── 阶段/漏斗规则 ───

  - id: rule_004
    title: "Pending Decision 包含 quotation"
    description: "Pending Decision 状态 = solution + quotation + meeting 三者合计。客户在等决定之前一定已经收到报价。"
    scope: business_logic
    enforcement:
      funnel_snapshot: |
        pending_decision_count = COUNT(leads WHERE
          milestone_completed('solution')
          AND milestone_completed('quotation')
          AND NOT milestone_completed('meeting')
        ) + COUNT(leads WHERE
          milestone_completed('meeting')
        )
    depends_on: [rule_005]

  - id: rule_005
    title: "漏斗统计按 current_milestone，不是累计覆盖率"
    description: "每个 lead 只计入当前所在 milestone 层级，不重复计入所有已完成的层级。"
    scope: business_logic
    enforcement:
      sql: |
        -- 正确：每个 lead 只占一行
        SELECT current_milestone, COUNT(*) as count
        FROM leads
        GROUP BY current_milestone
        ORDER BY milestone_order(current_milestone);
    depends_on: []

  - id: rule_006
    title: "不可空里程碑序列"
    description: "lead_milestones 中的 milestone_key 必须按顺序完成，不能跳过。完成 milestone 'meeting' 时，'solution' 必须已完成。"
    scope: database
    enforcement:
      application_logic: true  # 在 API 层或 trigger 中校验
    depends_on: []

  # ─── 业务语义规则 ───

  - id: rule_007
    title: "Milestone 只表示过程，不表示结果"
    description: "won/lost 不写进 lead_milestones，只能写入 leads.final_status。milestone 是过程指标，final_status 是结果指标。"
    scope: business_logic
    enforcement:
      application_logic: |
        INSERT milestone('meeting') → leads.current_milestone = 'meeting'
        SET leads.final_status = 'won' → 不插入新 milestone
    depends_on: [rule_006]

  - id: rule_008
    title: "Lead 详情页须保留旧字段兼容直到 Day45"
    description: "Day45 之前，leads.stage 字段在详情页只读展示，不可删除。即使业务层不再写 stage，前端必须保留显示兼容。"
    scope: ui
    enforcement:
      code_review: "检查 lead detail 页面是否移除 stage 显示 — Day45 前禁止"
    depends_on: [rule_007]  # 依赖灰度退役计划

  - id: rule_009
    title: "所有 Migration 必须幂等"
    description: "每条 migration 必须可重复安全执行。使用 IF NOT EXISTS / IF EXISTS / OR REPLACE 等幂等语法。"
    scope: database
    enforcement:
      sql_template: |
        -- 创建表
        CREATE TABLE IF NOT EXISTS ...
        -- 加列
        ALTER TABLE ... ADD COLUMN IF NOT EXISTS ...
        -- 删列
        ALTER TABLE ... DROP COLUMN IF EXISTS ...
        -- 创建策略
        DROP POLICY IF EXISTS ... ON ...;
        CREATE POLICY ...
    depends_on: []

  - id: rule_010
    title: "Prod 数据库禁止直接实验"
    description: "所有 migration 先在 dev Supabase 实例执行并通过，再应用到 prod。禁止在 prod 数据库上试错。"
    scope: operations
    enforcement:
      pipeline: "dev migration → build → test → prod migration"
    depends_on: []

  # ─── 灰度发布规则 ───

  - id: rule_011
    title: "Day30 停止写 leads.stage，Day60 删除"
    description: |
      灰度上线后：
      - Day1-14: 新旧双写（同时写 stage + milestones）
      - Day14-30: stage 只读，业务层不再更新
      - Day30-60: stage 列废弃，仅保留兼容性查询
      - Day60+: 删除 leads.stage 列
    scope: rollout
    enforcement:
      migration: |
        -- Day30: 禁止所有 API 写 stage
        -- Day60: ALTER TABLE leads DROP COLUMN stage;
    depends_on: []

  - id: rule_012
    title: "Feature Flag 按用户粒度"
    description: "feature flag 不按环境变量、不按 IP、不按域名。全部基于 user_features 表，以 user_id 为粒度。"
    scope: architecture
    enforcement:
      schema: |
        CREATE TABLE user_features (
          user_id UUID REFERENCES profiles(id) ON DELETE CASCADE,
          feature_key TEXT NOT NULL,
          enabled BOOLEAN NOT NULL DEFAULT false,
          created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
          PRIMARY KEY (user_id, feature_key)
        );
    depends_on: [rule_003]

  # ─── 安全性 ───

  - id: rule_101
    title: "RLS 无全局绕过"
    description: |
      任何新表必须启用 RLS。不允许有表 RLS 关闭。
      - 销售只能看/改自己 assigned 的 lead
      - admin/boss 看全部
      - 提成只看自己和下属
    scope: security
    enforcement:
      rls_template: |
        -- 每张新表都执行
        ALTER TABLE {table_name} ENABLE ROW LEVEL SECURITY;

        -- 销售看自己的
        CREATE POLICY {table_name}_own ON {table_name}
          FOR ALL USING (assigned_to = auth.uid());

        -- admin 看全部
        CREATE POLICY {table_name}_admin ON {table_name}
          FOR ALL USING (
            EXISTS (SELECT 1 FROM profiles
              WHERE id = auth.uid() AND role IN ('admin', 'boss'))
          );
    depends_on: [rule_003]

  - id: rule_102
    title: "service_role key 只能用于 cron/后台任务"
    description: "API 路由不能直接使用 service_role key。仅有 cron job 和后台数据维护使用。"
    scope: security
    enforcement:
      code_review: "检查 API routes 中是否使用 supabase.auth.getUser() 而非 service_role"
    depends_on: []

  # ─── 数据一致性 ───

  - id: rule_013
    title: "Timeline 必须可重建客户完整历史"
    description: "所有业务动作必须写入 timeline_event 统一表。milestone、task、follow-up、document 各自独立存储但 timeline 层必须能 UNION ALL 重建完整客户时间线，不丢历史。"
    scope: architecture
    enforcement:
      code_review: "Lead Timeline 页面必须 UNION ALL 4张表（lead_milestones + follow_up_logs + tasks + lead_documents），按 created_at 排序。不能只显示其中1-2种事件。"
    depends_on: [rule_001, rule_002, rule_006]

  - id: rule_014
    title: "Milestone 计算逻辑统一在 lib/milestones.ts"
    description: "deriveStage()、milestone 顺序校验、漏斗统计等所有 milestone 相关逻辑必须在 lib/milestones.ts 中定义。workbench、lead detail、cron 三处引用同一函数，禁止各自实现。"
    scope: architecture
    enforcement:
      code_review: |
        搜索以下文件是否 import 自 lib/milestones.ts：
        - app/workbench/**/*.ts
        - app/leads/**/*.ts
        - cron/*.ts
        发现重复实现 → 阻止合并
    depends_on: [rule_005, rule_006]

  - id: rule_015
    title: "Day30 后业务逻辑禁止依赖 leads.stage"
    description: "Day30 之后，所有业务逻辑（workbench 状态判断、funnel 统计、条件分支）必须使用 deriveStage() 从 milestone 数据推导，不得直接读取 leads.stage 字段。否则旧列永远删不掉。"
    scope: operations
    enforcement:
      code_review: "搜索 leads.stage / lead.stage / `stage` 在业务代码中的引用 → 标记为 P0 违规"
    depends_on: [rule_011, rule_014]

  - id: rule_016
    title: "是否待跟进只看 tasks 表"
    description: "判断一个 lead 是否待跟进（is_pending / needs_followup）只查 tasks 表有无当前用户的未完成 task。禁止读 leads.next_follow_up 或 follow_up_logs 的最近记录。三套真相源必有同步问题。"
    scope: database
    enforcement:
      code_review: |
        搜索 leads.next_follow_up 引用：
        - API routes 中禁止 SELECT leads.next_follow_up 用于跟进判断
        - cron 中禁止用 next_follow_up 判断超时
        全部改为查 tasks 表
    depends_on: [rule_002]

  # ─── 架构治理 ───

  - id: rule_011
    title: "架构权威控制 (Architecture Source Control)"
    description: |
      定义架构文档的权威层级，防止设计意图在传递过程中产生漂移。
      任何 schema 变更必须遵循此层级。
    scope: governance
    authority_order:
      - "ARCHITECTURE_RULES.yaml — Schema Authority: 所有 schema 定义以本文档为准"
      - "production database schema — Ground Truth: 运行时事实"
      - "migration files (supabase/migrations/) — Implementation: schema 的可重复构建脚本"
      - "application code (src/) — Consumer: 消费 schema，不定义 schema"
      - "DEV_PLAN.md — Design Archive: 设计意图记录，不作为 schema 定义源"
      - "PRD — Product Archive: 产品需求，不定义数据库 schema"
    enforcement:
      process: |
        1. 任何 schema 变更必须先更新 ARCHITECTURE_RULES.yaml
        2. 然后编写 migration SQL
        3. 然后更新 DEV_PLAN 中过时的 schema 描述
        4. 禁止从 DEV_PLAN 或 PRD 直接生成 migration
        5. 禁止 application code 通过 ORM 定义 schema
    audit:
      frequency:
        - "每次 migration: ARCH_RULES 更新在前，migration 在后"
        - "每次 push: migration ↔ ARCH_RULES 同步检查"
        - "每月: ARCH_RULES ↔ production schema ↔ migration files 全量核对"
    depends_on: []

# ─── 文件所有权 ───
# 执行器不得跨目录修改

ownership:
  database:
    description: "数据库层 — migration、schema、RLS、seed、rollback"
    owner: executor-database
    files:
      - "supabase/migrations/"
      - "supabase/seed.sql"
    forbidden: ["app/", "lib/"]

  workbench:
    description: "销售工作台 — Inbox、TaskList、Overdue、Progress、Feature Flag 开关"
    owner: executor-workbench
    files:
      - "app/workbench/"
    forbidden: ["app/leads/", "supabase/"]

  lead_detail:
    description: "Lead 详情 — Timeline、Milestone、NextAction、文档"
    owner: executor-lead-detail
    files:
      - "app/leads/"
    forbidden: ["app/workbench/", "supabase/"]

  follow_up_engine:
    description: "跟进引擎 — follow_up_logs API、tasks auto-create、No Answer 检测、cron job"
    owner: executor-followup
    files:
      - "app/api/follow-ups/"
      - "app/api/tasks/"
      - "cron/"
    forbidden: ["app/workbench/", "app/leads/", "supabase/"]

  observability:
    description: "可观测性 — 日结指标、漏斗快照、使用量看板"
    owner: executor-observability
    files:
      - "app/dashboard/"
      - "app/api/metrics/"
    forbidden: ["app/workbench/", "app/leads/"]

  shared:
    description: "共享 — 通用组件、类型定义、工具函数"
    owner: executor-shared
    files:
      - "lib/"
      - "types/"
      - "components/shared/"
    notes: "shared 目录修改须通知其他执行器"

# ─── Epic 分解 ───

epics:
  epic_1:
    name: "数据库层"
    executor: executor-database
    tasks:
      - "创建 6 张新表 (lead_milestones, follow_up_logs, tasks, lead_documents, user_features, crm_daily_funnel_snapshot)"
      - "迁移 leads 表（新增 current_milestone、修改 FK 到 profiles）"
      - "RLS 策略"
      - "Seed 数据（20 条匿名 leads）"
      - "Rollback 脚本"

  epic_2:
    name: "销售工作台"
    executor: executor-workbench
    tasks:
      - "GET /api/workbench — 聚合 Inbox/TaskList/Overdue/Progress"
      - "Feature Flag 管理 UI"
      - "前端页面 (/workbench)"

  epic_3:
    name: "Lead 详情"
    executor: executor-lead-detail
    tasks:
      - "GET /api/leads/[id] — 详情 + 时间线 + 里程碑"
      - "POST milestone 完成"
      - "POST follow-up 记录"
      - "前端页面 (/leads/[id])"

  epic_4:
    name: "跟进引擎"
    executor: executor-followup
    tasks:
      - "follow_up_logs CRUD"
      - "tasks auto-create on follow-up"
      - "No Answer 检测逻辑（3次无回应 → 标记）"
      - "cron job：到期提醒、超时标记"

  epic_5:
    name: "可观测性"
    executor: executor-observability
    tasks:
      - "crm_daily_funnel_snapshot cron"
      - "日结指标 API"
      - "使用量看板 UI"

