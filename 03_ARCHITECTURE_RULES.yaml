    priority: high

  - id: C004
    rule: "漏斗按 current_milestone"
    source: "DEV_PLAN 口径修正"
    priority: high

  - id: C005
    rule: "Day30 stop write stage, Day60 drop"
    rule_ref: rule_011
    priority: critical

  - id: C006
    rule: "所有 FK 走 profiles.id"
    rule_ref: rule_003
    priority: critical

  - id: C007
    rule: "Feature Flag 按 user_id"
    rule_ref: rule_012
    source: "DEV_PLAN rollout"
    priority: critical

  - id: C006
    rule: "所有 FK 走 profiles.id"
    source: "PRD schema"
    priority: critical

  - id: C007
    rule: "Feature Flag 按 user_id"
    source: "DEV_PLAN 功能开关"
    priority: high

  - id: C008
