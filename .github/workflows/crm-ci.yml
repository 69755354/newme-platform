name: crm-ci

on:
  workflow_call:
    inputs:
      ci_run_id:
        required: true
        type: string
      ci_conclusion:
        required: true
        type: string
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: crm-ci-${{ inputs.ci_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  hermes-contract:
    name: Hermes CI webhook contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record upstream CI result
        run: |
          echo "crm-ci is the Hermes CI contract."
          echo "Upstream CI run: ${{ inputs.ci_run_id || 'manual' }}"
          echo "Upstream conclusion: ${{ inputs.ci_conclusion || 'manual' }}"

      - name: Require upstream ci success
        run: |
          if [ "${{ inputs.ci_conclusion }}" != "success" ]; then
            echo "Upstream ci did not succeed; Hermes must treat this as blocking."
            exit 1
          fi
          echo "Upstream ci succeeded — Hermes OK"
