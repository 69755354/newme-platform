# Install as /etc/systemd/journald.conf.d/50-newme-retention.conf (S7 item 5,
# review 5-logging-monitoring F10). The previous 7-day limit lost the evidence of
# a failed Meta delivery before anyone looked. 30 days of this host's journal is
# well under 1 GB (125 MB for 7 days of everything).
[Journal]
MaxRetentionSec=30day
SystemMaxUse=1500M
RuntimeMaxUse=100M
Storage=persistent
