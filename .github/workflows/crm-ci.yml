name: crm-ci

on:
  repository_dispatch:
    types: [crm-ci]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: crm-ci-${{ github.event.client_payload.ci_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  hermes-contract:
    name: Hermes CI webhook contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record upstream CI result
        run: |
          echo "crm-ci is the Hermes CI contract."
          echo "Upstream CI run: ${{ github.event.client_payload.ci_run_id || 'manual' }}"
          echo "Upstream conclusion: ${{ github.event.client_payload.ci_conclusion || 'manual' }}"

      - name: Require upstream ci success
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          if [ "${{ github.event.client_payload.ci_conclusion }}" != "success" ]; then
            echo "Upstream ci did not succeed; Hermes must treat this as blocking."
            exit 1
          fi
          echo "Upstream ci succeeded — Hermes OK"
