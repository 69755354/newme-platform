name: ci

on:
  workflow_dispatch:
    inputs:
      release_final:
        description: Require every tracked TASKBOARD row to be complete
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_ENV: test
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
  SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
  NEXT_PUBLIC_SENTRY_DSN: ''

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # fetch-depth: 0 is load-bearing here too: tests/release/migration-history-gate.test.mjs
      # verifies supabase/migration-history-baseline.sha256 against the base commit
      # in git, and refuses to pass when that commit is absent from the clone. A
      # shallow checkout makes the immutability proof unverifiable, and the gate
      # fails closed rather than reporting an unverified manifest as OK.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E secret and artifact gate
        run: npm run check:e2e-secrets && npm run check:e2e-artifacts

      - name: E2E secret gate negative regression
        run: node --test tests/security/e2e-secret-gate.test.mjs

      - name: Taskboard gate
        run: npm run check:taskboard

      - name: Route file gate
        run: npm run check:route-files

      - name: Schema reference gate
        run: npm run check:schema-refs

      - name: Supabase boundary self-test
        run: node scripts/check-supabase-boundaries.mjs --self-test

      - name: Supabase boundary gate
        run: npm run check:supabase-boundaries

      - name: Database static regression gate
        run: npm run check:db-static

      - name: CRM regression contract
        run: python3 scripts/crm-regression.py --self-test

      - name: Lint baseline gate
        run: npm run lint:baseline

      - name: Workflow YAML validation
        run: npm run check:workflows

      - name: Supply chain gate
        run: npm run check:supply-chain -- --accept-known

      - name: Database type source gate
        run: npm run check:database-types

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Repository tests
        run: npm test

      - name: Release hygiene regression
        run: node --test tests/release/*.test.mjs

      - name: Install production smoke browser
        run: npx playwright install --with-deps chromium

      - name: Production anonymous browser smoke
        run: npx playwright test --config=playwright.production-smoke.config.ts

      - name: Build
        run: npm run build

      - name: Build worktree hygiene
        run: |
          if test -n "$(git status --porcelain --untracked-files=all)"; then
            echo "Build left tracked or untracked worktree changes:"
            git status --short --untracked-files=all
            exit 1
          fi
          if test -e tsconfig.tsbuildinfo; then
            echo "Build recreated the forbidden root tsconfig.tsbuildinfo"
            exit 1
          fi
  windows-checkout:
    name: Windows checkout and SPEC gate
    # PR runs, plus the release-final dispatch that infra/release/required-jobs.json
    # gates production on. It was previously pull_request-only, which made it
    # impossible for a release-final run to carry it: the canonical deploy would
    # have had to require a job that could not exist in the run it accepts.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.release_final) }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # On a dispatch there is no pull_request context, so this falls back to the
      # dispatched SHA rather than checking out an empty ref.
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: sam16-checkout
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            crm-v3/SPEC.md
            scripts/check-spec.sh
            scripts/run-bash.mjs
          sparse-checkout-cone-mode: false

      - name: Verify clean checkout and SPEC
        shell: pwsh
        working-directory: sam16-checkout
        run: |
          $status = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw "git status failed" }
          if ($status) { throw "worktree is not clean: $status" }
          node scripts/run-bash.mjs scripts/check-spec.sh
          if ($LASTEXITCODE -ne 0) { throw "check-spec failed" }

  taskboard-completion:
    name: Release-final taskboard completion
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_final }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require completed taskboard
        run: npm run check:taskboard:complete

  local-database:
    name: Narrow task follow-up database contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Verify pinned local CLI
        run: |
          test "$(supabase --version)" = "2.113.0"
          test -f supabase/ci-local/supabase/config.toml
          node supabase/ci-local/verify-provenance.mjs

      - name: Start local database and replay narrowed contract
        run: |
          supabase db start --workdir supabase/ci-local
          supabase db reset --local --workdir supabase/ci-local --yes
          node supabase/ci-local/verify-reset.mjs
          supabase db reset --local --workdir supabase/ci-local --yes
          node supabase/ci-local/verify-reset.mjs

      - name: Run isolated database tests
        run: |
          test_output="$(supabase test db --local --workdir supabase/ci-local supabase/ci-local/supabase/tests/database 2>&1)"
          printf '%s\n' "$test_output"
          printf '%s\n' "$test_output" | node scripts/verify-pgtap-output.mjs

      - name: Stop local database
        if: always()
        run: supabase stop --project-id newme-ci-task-followup-v1 --no-backup

  migration-replay:
    name: Migration replay and release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The job above exercises four migrations under supabase/ci-local. The other
    # 106 in supabase/migrations/ — including every L0 security migration — had
    # never been executed anywhere except production. This job executes them
    # against a throwaway database and then asserts, at the behaviour level, that
    # they do what they claim.
    #
    # No Supabase CLI and no Docker-in-Docker: a postgres service container plus
    # the psql client that ubuntu-latest already ships. No secrets are referenced,
    # and the only database reachable from this job is the service container.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      # fetch-depth: 0 is load-bearing, not hygiene. The history gate below
      # cross-checks supabase/migration-history-baseline.sha256 against the
      # BASE_COMMIT recorded in its own header using `git ls-tree` and `git show`;
      # without full history that commit is absent and the gate FAILS rather than
      # downgrading itself to a warning.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      # Runs before anything is replayed: if applied history has been edited,
      # renamed or deleted, every replay result below is measuring a history that
      # production does not have.
      - name: Migration history immutability and forward-only gate
        run: npm run check:migration-history

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
          psql --version

      # Negative control first. If the assertions hold against the un-remediated
      # floor they prove nothing, and the gate below would be theatre.
      - name: Negative control (assertions must fail without the migrations)
        run: |
          createdb control
          MODE=control PGDATABASE=control bash scripts/replay-migrations.sh

      - name: Replay branch migrations and assert release contracts
        run: |
          createdb replay
          MODE=branch PGDATABASE=replay bash scripts/replay-migrations.sh

      # Gating, and not informational. The reviewed revision ran this step with
      # continue-on-error: true, which meant the job was green whatever it
      # printed — a step whose result is discarded is not evidence, and this
      # repository has already booked that pattern as F-05.
      #
      # The full history still does not replay from empty; that debt predates the
      # branch and cannot be paid without a schema baseline taken by an operator
      # who holds credentials. So what is gated is not "the history replays" but
      # "the history fails exactly where supabase/replay/history-replay-expectation.txt
      # says it fails": same file, same count applied before it. A branch that
      # makes it fail earlier — the shape of an accidental edit to applied
      # history — turns this step red, and so does a branch that fixes it without
      # updating the expectation.
      - name: Full migration history replay against the recorded failure point
        run: |
          createdb history
          MODE=history PGDATABASE=history bash scripts/replay-migrations.sh
