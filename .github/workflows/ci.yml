name: ci

on:
  workflow_dispatch:
    inputs:
      release_final:
        description: Require every tracked TASKBOARD row to be complete
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_ENV: test
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
  SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
  NEXT_PUBLIC_SENTRY_DSN: ''

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E secret and artifact gate
        run: npm run check:e2e-secrets && npm run check:e2e-artifacts

      - name: E2E secret gate negative regression
        run: node --test tests/security/e2e-secret-gate.test.mjs

      - name: Taskboard gate
        run: npm run check:taskboard

      - name: Route file gate
        run: npm run check:route-files

      - name: Schema reference gate
        run: npm run check:schema-refs

      - name: Supabase boundary self-test
        run: node scripts/check-supabase-boundaries.mjs --self-test

      - name: Supabase boundary gate
        run: npm run check:supabase-boundaries

      - name: Database static regression gate
        run: npm run check:db-static

      - name: CRM regression contract
        run: python3 scripts/crm-regression.py --self-test

      - name: Lint baseline gate
        run: npm run lint:baseline

      - name: Workflow YAML validation
        run: npm run check:workflows

      - name: Supply chain gate
        run: npm run check:supply-chain -- --accept-known

      - name: Database type source gate
        run: npm run check:database-types

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Repository tests
        run: npm test

      - name: Release hygiene regression
        run: node --test tests/release/*.test.mjs

      - name: Install production smoke browser
        run: npx playwright install --with-deps chromium

      - name: Production anonymous browser smoke
        run: npx playwright test --config=playwright.production-smoke.config.ts

      - name: Build
        run: npm run build

      - name: Build worktree hygiene
        run: |
          if test -n "$(git status --porcelain --untracked-files=all)"; then
            echo "Build left tracked or untracked worktree changes:"
            git status --short --untracked-files=all
            exit 1
          fi
          if test -e tsconfig.tsbuildinfo; then
            echo "Build recreated the forbidden root tsconfig.tsbuildinfo"
            exit 1
          fi
  windows-checkout:
    name: Windows checkout and SPEC gate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: sam16-checkout
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            crm-v3/SPEC.md
            scripts/check-spec.sh
            scripts/run-bash.mjs
          sparse-checkout-cone-mode: false

      - name: Verify clean checkout and SPEC
        shell: pwsh
        working-directory: sam16-checkout
        run: |
          $status = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw "git status failed" }
          if ($status) { throw "worktree is not clean: $status" }
          node scripts/run-bash.mjs scripts/check-spec.sh
          if ($LASTEXITCODE -ne 0) { throw "check-spec failed" }

  taskboard-completion:
    name: Release-final taskboard completion
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_final }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require completed taskboard
        run: npm run check:taskboard:complete

  local-database:
    name: Narrow task follow-up database contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Verify pinned local CLI
        run: |
          test "$(supabase --version)" = "2.113.0"
          test -f supabase/ci-local/supabase/config.toml
          node supabase/ci-local/verify-provenance.mjs

      - name: Start local database and replay narrowed contract
        run: |
          supabase db start --workdir supabase/ci-local
          supabase db reset --local --workdir supabase/ci-local --yes
          node supabase/ci-local/verify-reset.mjs
          supabase db reset --local --workdir supabase/ci-local --yes
          node supabase/ci-local/verify-reset.mjs

      - name: Run isolated database tests
        run: |
          test_output="$(supabase test db --local --workdir supabase/ci-local supabase/ci-local/supabase/tests/database 2>&1)"
          printf '%s\n' "$test_output"
          printf '%s\n' "$test_output" | node scripts/verify-pgtap-output.mjs

      - name: Stop local database
        if: always()
        run: supabase stop --project-id newme-ci-task-followup-v1 --no-backup
