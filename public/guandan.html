<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>掼蛋 Guandan</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
body { font-family: 'Microsoft YaHei', sans-serif; background: #1a5d2e; min-height: 100vh; overflow: hidden; }
#table { position: relative; width: 100vw; height: 100vh; background: radial-gradient(ellipse at center, #2d8659 0%, #1a5d2e 100%); }
.player { position: absolute; background: rgba(0,0,0,0.4); border-radius: 10px; padding: 8px; color: white; transition: box-shadow 0.3s; }
#player-bottom { bottom: 0; left: 50%; transform: translateX(-50%); width: 90%; max-width: 900px; padding: 10px; }
#player-top { top: 0; left: 50%; transform: translateX(-50%); width: 300px; }
#player-left { top: 50%; left: 0; transform: translateY(-50%); width: 180px; }
#player-right { top: 50%; right: 0; transform: translateY(-50%); width: 180px; }
.player-name { font-size: 14px; margin-bottom: 4px; display: flex; justify-content: space-between; }
.team-label { color: #ffd700; }
.hand { display: flex; gap: 2px; justify-content: center; min-height: 60px; }
#hand-bottom { min-height: 100px; flex-wrap: wrap; }
#hand-top, #hand-left, #hand-right { flex-wrap: wrap; }
#hand-left, #hand-right { flex-direction: column; align-items: center; }
.card-count { font-size: 12px; color: #ffd700; }
.card { width: 50px; height: 70px; background: white; border: 2px solid #333; border-radius: 4px; display: inline-flex; flex-direction: column; justify-content: space-between; padding: 3px; font-weight: bold; cursor: pointer; position: relative; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); transition: transform 0.15s, box-shadow 0.15s; }
.card.small { width: 30px; height: 42px; font-size: 10px; padding: 1px; }
.card.tiny { width: 22px; height: 32px; font-size: 9px; padding: 1px; }
.card.red { color: #d00; }
.card.black { color: #000; }
.card.joker { background: linear-gradient(45deg, #ff6b6b, #ffd93d); color: white; }
.card.selected { transform: translateY(-15px); border-color: #ffd700; box-shadow: 0 0 10px #ffd700; }
.card-value { font-size: 14px; line-height: 1; }
.card-small .card-value { font-size: 10px; }
.card-suit { font-size: 14px; align-self: flex-end; }
.card-small .card-suit { font-size: 10px; }
.card.highlight { box-shadow: 0 0 8px #ff0; }
#center-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; min-width: 300px; min-height: 150px; }
#last-play { display: flex; gap: 3px; justify-content: center; margin-top: 10px; flex-wrap: wrap; max-width: 280px; min-height: 50px; }
#play-type { font-size: 18px; color: #ffd700; margin-bottom: 5px; }
#current-player { font-size: 20px; color: #ffd700; margin-bottom: 10px; }
#pass-indicator { color: #ff6b6b; font-size: 16px; }
#controls { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 100; }
button { padding: 8px 20px; font-size: 14px; background: #ffd700; color: #1a5d2e; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: all 0.15s; }
button:hover:not(:disabled) { background: #ffed4e; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
button:active:not(:disabled) { transform: translateY(0); }
button:disabled { background: #888; cursor: not-allowed; opacity: 0.5; }
button.primary { background: linear-gradient(135deg, #ffd700, #ff9800); font-size: 16px; padding: 10px 25px; }
#info-panel { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; padding: 10px; border-radius: 8px; font-size: 13px; min-width: 180px; }
#info-panel h3 { color: #ffd700; margin-bottom: 5px; font-size: 14px; }
.pass-mark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); color: #ff6b6b; font-size: 40px; font-weight: bold; opacity: 0.85; pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); border: 3px solid #ff6b6b; padding: 0 12px; border-radius: 8px; background: rgba(0,0,0,0.3); animation: stampIn 0.3s ease-out; z-index: 50; }
@keyframes stampIn { from { transform: translate(-50%, -50%) rotate(-15deg) scale(2); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-15deg) scale(1); opacity: 0.85; } }
.pass-stamp-fly { position: fixed; color: #ff6b6b; font-size: 60px; font-weight: bold; pointer-events: none; z-index: 2000; text-shadow: 3px 3px 6px rgba(0,0,0,0.8); transform: translate(-50%, -50%); animation: passFly 0.7s ease-out forwards; }
@keyframes passFly { 0% { transform: translate(-50%, -50%) scale(0.3) rotate(-30deg); opacity: 0; } 30% { transform: translate(-50%, -50%) scale(1.3) rotate(-15deg); opacity: 1; } 100% { transform: translate(-50%, -150%) scale(1) rotate(-15deg); opacity: 0; } }
.pass-shake { animation: shake 0.4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
#player-bottom.pass-shake { transform: translateX(-50%) translateX(0); }
.card-back { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid #1e3a8a; }
.active-turn { box-shadow: 0 0 15px #ffd700; border: 2px solid #ffd700; }
.finished { opacity: 0.6; filter: grayscale(0.5); }
.finished .card { border-color: #4caf50; }
.finished-mark { color: #4caf50; font-size: 18px; font-weight: bold; padding: 20px; text-align: center; }
.more-cards { color: #ffd700; font-size: 11px; font-weight: bold; padding: 2px 4px; }
.finished-fly { position: fixed; font-size: 50px; pointer-events: none; z-index: 2000; transform: translate(-50%, -50%); animation: finishedFly 1.5s ease-out forwards; }
@keyframes finishedFly { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 30% { transform: translate(-50%, -50%) scale(1.5) rotate(20deg); opacity: 1; } 100% { transform: translate(-50%, -300%) scale(1) rotate(360deg); opacity: 0; } }
#message { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); color: #ffd700; padding: 20px 40px; border-radius: 10px; font-size: 24px; z-index: 1000; display: none; box-shadow: 0 0 20px rgba(255,215,0,0.5); }
#tutorial-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 2000; display: none; justify-content: center; align-items: center; }
#tutorial-panel { background: linear-gradient(135deg, #2d8659, #1a5d2e); color: white; padding: 30px; border-radius: 15px; max-width: 700px; max-height: 85vh; overflow-y: auto; box-shadow: 0 0 30px rgba(255,215,0,0.5); }
#tutorial-panel h2 { color: #ffd700; margin-bottom: 15px; text-align: center; font-size: 26px; }
#tutorial-panel h3 { color: #ffd700; margin: 15px 0 8px 0; font-size: 18px; border-bottom: 1px solid rgba(255,215,0,0.3); padding-bottom: 5px; }
#tutorial-panel p, #tutorial-panel li { line-height: 1.6; margin-bottom: 8px; font-size: 14px; }
#tutorial-panel ul { padding-left: 20px; margin-bottom: 10px; }
.combo-card { display: inline-block; background: white; color: #d00; width: 30px; height: 40px; border-radius: 3px; text-align: center; font-weight: bold; padding-top: 8px; margin: 0 2px; font-size: 14px; }
.combo-card.black { color: #000; }
.tutorial-nav { display: flex; justify-content: space-between; margin-top: 20px; }
.tutorial-nav button { padding: 8px 20px; }
#hint-panel { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,0.7); color: white; padding: 10px 15px; border-radius: 8px; max-width: 250px; font-size: 13px; line-height: 1.5; border-left: 4px solid #ffd700; }
#hint-panel .hint-title { color: #ffd700; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
#hint-panel.hidden-hint { opacity: 0.3; }
#tutorial-btn { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #ffd700; color: #1a5d2e; border: none; padding: 6px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; z-index: 100; transition: all 0.15s; }
#tutorial-btn:hover { background: #ffed4e; transform: translateX(-50%) translateY(-2px); }
.tooltip { position: absolute; background: #333; color: white; padding: 5px 10px; border-radius: 4px; font-size: 12px; pointer-events: none; z-index: 1500; display: none; }
#hand-analyzer { position: absolute; right: 220px; top: 10px; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 8px; max-width: 200px; font-size: 12px; line-height: 1.5; border-left: 4px solid #4caf50; }
.analyzer-title { color: #4caf50; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
.analyzer-row { display: flex; justify-content: space-between; padding: 2px 0; }
.analyzer-row .label { color: #ccc; }
.analyzer-row .val { color: #ffd700; font-weight: bold; }
#action-log { position: absolute; left: 10px; top: 220px; background: rgba(0,0,0,0.7); color: white; padding: 8px 12px; border-radius: 8px; max-width: 250px; font-size: 12px; line-height: 1.5; border-left: 4px solid #03a9f4; max-height: 300px; overflow-y: auto; }
.log-title { color: #03a9f4; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
.log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 11px; }
.log-entry:last-child { border-bottom: none; }
.log-entry.mine { color: #ffd700; }
.log-entry.partner { color: #4caf50; }
.log-entry.enemy { color: #ff6b6b; }
.log-entry.system { color: #aaa; font-style: italic; }
.card.playable { box-shadow: 0 0 5px #4caf50; }
.card.forced-play { box-shadow: 0 0 8px #ff9800; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 5px #ff9800; } 50% { box-shadow: 0 0 15px #ff9800; } 100% { box-shadow: 0 0 5px #ff9800; } }
.achievement-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #ffd700, #ff9800); color: #1a5d2e; padding: 15px 30px; border-radius: 10px; font-weight: bold; z-index: 3000; display: none; box-shadow: 0 0 30px #ffd700; animation: slideDown 0.5s ease-out; }
@keyframes slideDown { from { transform: translate(-50%, -100px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
#quick-actions { position: absolute; bottom: 130px; left: 10px; display: flex; flex-direction: column; gap: 5px; }
#quick-actions button { padding: 6px 12px; font-size: 12px; background: #03a9f4; }
#quick-actions button:hover:not(:disabled) { background: #29b6f6; }
#difficulty-selector { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); margin-left: 80px; }
#difficulty-selector select { padding: 4px 8px; font-size: 12px; background: #ffd700; color: #1a5d2e; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }

/* ============= 模态框 (游戏结束/战绩) ============= */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 4000; display: none; justify-content: center; align-items: center; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-panel { background: linear-gradient(135deg, #2d8659, #1a5d2e); color: white; padding: 30px 40px; border-radius: 15px; max-width: 500px; box-shadow: 0 0 40px rgba(255,215,0,0.4); animation: popIn 0.4s cubic-bezier(0.4, 0.0, 0.2, 1); }
.modal-panel.wide { max-width: 700px; max-height: 85vh; overflow-y: auto; }
@keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-panel h2 { color: #ffd700; text-align: center; margin-bottom: 15px; font-size: 28px; }
.modal-panel h3 { color: #ffd700; margin: 15px 0 8px 0; font-size: 16px; border-bottom: 1px solid rgba(255,215,0,0.3); padding-bottom: 5px; }
.result-headline { text-align: center; font-size: 15px; margin-bottom: 15px; line-height: 1.6; }
.placing-list { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px; margin-bottom: 15px; }
.place-row { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 4px; }
.place-row.first { background: linear-gradient(90deg, rgba(255,215,0,0.2), transparent); }
.place-row.last { background: linear-gradient(90deg, rgba(255,107,107,0.2), transparent); }
.place-row .place-name { font-weight: bold; color: #ffd700; }
.place-row .player-name { color: #fff; }
.place-row .player-name.team-A { color: #4caf50; }
.place-row .player-name.team-B { color: #ff6b6b; }
.level-change { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
.result-team { padding: 12px; border-radius: 8px; text-align: center; background: rgba(0,0,0,0.3); }
.result-team.winner { background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,152,0,0.2)); border: 2px solid #ffd700; }
.result-team.loser { opacity: 0.8; border: 1px solid #666; }
.team-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
.team-level { font-size: 13px; }
.team-level .old-level { color: #888; text-decoration: line-through; }
.team-level .new-level { color: #ffd700; font-weight: bold; font-size: 15px; }
.stats-summary { text-align: center; color: #aaa; font-size: 12px; margin-bottom: 15px; }
.modal-actions { display: flex; gap: 10px; justify-content: center; }
.btn-active { background: linear-gradient(135deg, #4caf50, #2e7d32) !important; color: #fff !important; box-shadow: 0 0 12px #4caf50 !important; }
.dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
.dash-card { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px; text-align: center; border: 1px solid rgba(255,215,0,0.2); }
.dash-label { color: #aaa; font-size: 12px; margin-bottom: 4px; }
.dash-value { color: #ffd700; font-size: 28px; font-weight: bold; }
.dash-sub { color: #888; font-size: 11px; margin-top: 4px; }

/* 战绩表 */
.game-stats { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
.game-stats th, .game-stats td { padding: 6px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 13px; }
.game-stats th { color: #ffd700; background: rgba(0,0,0,0.3); }
.achievements-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 15px; }
.achv-row { display: flex; align-items: center; padding: 6px 8px; background: rgba(0,0,0,0.3); border-radius: 4px; font-size: 12px; }
.achv-row.unlocked { border-left: 3px solid #ffd700; }
.achv-row.locked { opacity: 0.5; }
.achv-row .achv-status { width: 24px; }
.achv-row .achv-name { font-weight: bold; color: #ffd700; margin-right: 6px; }
.achv-row .achv-desc { color: #aaa; font-size: 11px; }

/* 移动端适配 */
@media (max-width: 768px) {
  #player-top { width: 90%; max-width: 280px; }
  #player-left, #player-right { width: 130px; }
  #info-panel { font-size: 11px; min-width: 140px; padding: 6px; }
  #hand-analyzer { right: 10px; top: auto; bottom: 230px; max-width: 160px; font-size: 11px; }
  #action-log { max-width: 200px; font-size: 11px; max-height: 200px; }
  #hint-panel { max-width: 200px; font-size: 11px; }
  .card { width: 40px; height: 56px; }
  .card-value { font-size: 12px; }
  .card-suit { font-size: 12px; }
  button { padding: 6px 14px; font-size: 12px; }
  .modal-panel { padding: 20px; margin: 10px; }
  .modal-panel h2 { font-size: 22px; }
}

/* ============= 动画1: 炸弹/王炸/同花顺 屏幕震动 + 闪光 ============= */
@keyframes tableShake {
  0%,100% { transform: translate(0,0); }
  15% { transform: translate(-6px,3px); }
  35% { transform: translate(5px,-4px); }
  55% { transform: translate(-4px,4px); }
  75% { transform: translate(3px,-2px); }
}
@keyframes bombFlash {
  0% { box-shadow: inset 0 0 0 0 rgba(255,215,0,0); }
  30% { box-shadow: inset 0 0 220px 60px rgba(255,215,0,.75); }
  100% { box-shadow: inset 0 0 0 0 rgba(255,215,0,0); }
}
@keyframes flushFlash {
  0% { box-shadow: inset 0 0 0 0 rgba(180,90,255,0); }
  30% { box-shadow: inset 0 0 220px 60px rgba(180,90,255,.8); }
  100% { box-shadow: inset 0 0 0 0 rgba(180,90,255,0); }
}
@keyframes rocketFlash {
  0% { box-shadow: inset 0 0 0 0 rgba(255,80,0,0); }
  30% { box-shadow: inset 0 0 300px 90px rgba(255,80,0,.9); }
  100% { box-shadow: inset 0 0 0 0 rgba(255,80,0,0); }
}
#table.impact-bomb   { animation: tableShake .5s, bombFlash .8s; }
#table.impact-flush  { animation: tableShake .5s, flushFlash .8s; }
#table.impact-rocket { animation: tableShake .7s, rocketFlash 1s; }
@media (max-width: 768px) {
  #table.impact-bomb, #table.impact-flush, #table.impact-rocket { animation-duration: .3s, .5s; }
}
@media (prefers-reduced-motion: reduce) {
  #table.impact-bomb, #table.impact-flush, #table.impact-rocket { animation: none; }
}

/* ============= 动画2: 手牌进度条 ============= */
.hand-bar { height: 5px; background: rgba(0,0,0,.35); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.hand-bar-fill { height: 100%; transition: width .45s cubic-bezier(.4,0,.2,1); }
#player-bottom .hand-bar-fill { background: linear-gradient(90deg, #4caf50, #ffd700); }
#player-top .hand-bar-fill,
#player-left .hand-bar-fill,
#player-right .hand-bar-fill { background: linear-gradient(90deg, #607d8b, #90a4ae); }
.hand-bar-fill.urgent { background: linear-gradient(90deg, #ff5252, #ff9800) !important; }
@keyframes urgentPulse { 0%,100% { box-shadow: 0 0 0 rgba(255,80,80,0); } 50% { box-shadow: 0 0 8px rgba(255,80,80,.8); } }
.hand-bar-fill.urgent { animation: urgentPulse .9s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .hand-bar-fill.urgent { animation: none; }
}
@media (max-width: 768px) { .hand-bar { height: 3px; } }

/* ============= 动画3: AI 思考指示器 ============= */
.thinking {
  position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.85); color: #ffd700;
  padding: 4px 10px; border-radius: 12px; font-size: 11px;
  display: inline-flex; align-items: center; gap: 5px;
  white-space: nowrap; z-index: 60;
  border: 1px solid rgba(255,215,0,.4);
}
.thinking .dot {
  width: 5px; height: 5px; background: #ffd700; border-radius: 50%;
  display: inline-block; animation: dotBounce 1.2s infinite;
}
.thinking .dot:nth-child(2) { animation-delay: .2s; }
.thinking .dot:nth-child(3) { animation-delay: .4s; }
@keyframes dotBounce {
  0%,60%,100% { transform: translateY(0); opacity: .35; }
  30% { transform: translateY(-4px); opacity: 1; }
}
#player-left .thinking, #player-right .thinking {
  left: auto; right: 0; transform: none;
}
@media (prefers-reduced-motion: reduce) {
  .thinking .dot { animation: none; opacity: 1; }
}
</style>
</head>
<body>
<div id="table">
  <div id="player-top" class="player">
    <div class="player-name"><span>AI 2 <span class="team-label">(B队)</span></span><span class="card-count" id="count-top">27张</span></div>
    <div class="hand" id="hand-top"></div>
  </div>
  <div id="player-left" class="player">
    <div class="player-name"><span>AI 3 <span class="team-label">(B队)</span></span><span class="card-count" id="count-left">27张</span></div>
    <div class="hand" id="hand-left"></div>
  </div>
  <div id="player-right" class="player">
    <div class="player-name"><span>AI 1 <span class="team-label">(A队)</span></span><span class="card-count" id="count-right">27张</span></div>
    <div class="hand" id="hand-right"></div>
  </div>
  <div id="player-bottom" class="player active-turn">
    <div class="player-name"><span>你 (A队)</span><span class="card-count" id="count-bottom">27张</span></div>
    <div class="hand" id="hand-bottom"></div>
  </div>

  <div id="center-area">
    <div id="current-player"></div>
    <div id="play-type"></div>
    <div id="last-play"></div>
  </div>

  <div id="controls">
    <button id="btn-play">出牌</button>
    <button id="btn-pass">过牌</button>
    <button id="btn-hint">提示</button>
    <button id="btn-new">新游戏</button>
    <button id="btn-daily" onclick="startDailyChallenge()">📅 今日</button>
  </div>

  <div id="quick-actions">
    <button onclick="quickAction('smallest')">出最小单</button>
    <button onclick="quickAction('biggest')">出最大单</button>
    <button onclick="quickAction('smallestPair')">出最小对</button>
    <button onclick="quickAction('smallestStraight')">出最小顺</button>
    <button onclick="quickAction('smallestBomb')">出最小炸弹</button>
    <button onclick="quickAction('plane')">出飞机</button>
    <button id="btn-autoplay" onclick="toggleAutoPlay()">🤖 托管</button>
  </div>

  <div id="difficulty-selector">
    <select id="difficulty">
      <option value="easy">😊 简单(适合新手)</option>
      <option value="medium" selected>🤔 中等</option>
      <option value="hard">😈 困难</option>
    </select>
  </div>

  <div id="info-panel">
    <h3>游戏信息</h3>
    <div>级数: <span id="level-info">2</span></div>
    <div>当前玩家: <span id="turn-info">-</span></div>
    <div>牌型: <span id="type-info">-</span></div>
    <div>轮次: <span id="round-info">1</span></div>
    <div>得分: A队 <span id="score-a">0</span> | B队 <span id="score-b">0</span></div>
    <div style="margin-top:8px;font-size:11px;color:#aaa;border-top:1px solid #555;padding-top:5px;">
      牌大小: 3&lt;4&lt;...&lt;K&lt;A&lt;2👑<br>
      💣 炸弹(4张)&gt; 普通牌<br>
      🌟 同花顺&gt; 炸弹<br>
      👑 王炸(大小王)最大
    </div>
  </div>

  <div id="message"></div>

  <button id="tutorial-btn">📖 教程</button>

  <div id="hint-panel">
    <div class="hint-title">💡 智能提示</div>
    <div id="hint-content">欢迎来到掼蛋！点击「📖 教程」学习规则, 或点击「提示」让系统帮你出牌。</div>
  </div>

  <div id="hand-analyzer">
    <div class="analyzer-title">🃏 你的手牌分析</div>
    <div id="analyzer-content"></div>
  </div>

  <div id="action-log">
    <div class="log-title">📜 行动记录</div>
    <div id="log-content"></div>
  </div>

  <div id="tutorial-overlay" onclick="if(event.target===this)toggleTutorial()">
    <div id="tutorial-panel"></div>
  </div>

  <div id="tooltip" class="tooltip"></div>
  <div id="achievement-toast" class="achievement-toast"></div>
</div>
