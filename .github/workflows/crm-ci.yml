name: crm-ci

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
  workflow_dispatch:

permissions: {}

jobs:
  hermes-contract:
    name: Hermes CI webhook contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record upstream CI result
        run: |
          echo "crm-ci triggered by ${{ github.event_name }}"
          echo "Upstream workflow: ${{ github.event.workflow_run.name }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"

      - name: Require upstream ci success
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "FAIL: upstream ci did not succeed"
            exit 1
          fi
          echo "PASS: upstream ci succeeded — Hermes OK"

      - name: Notify Telegram
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          MSG="ci ${{ github.event.workflow_run.conclusion }} — ${{ github.event.workflow_run.head_commit.message }}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id=8459729760 \
            --data-urlencode "text=${MSG}" \
            -d disable_notification=true \
            -o /dev/null -w "TG: %{http_code}\n"
