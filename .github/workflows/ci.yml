name: ci

on:
  pull_request:
  push:
    branches:
      - work
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_ENV: test
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
  SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
  NEXT_PUBLIC_SENTRY_DSN: ''

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Taskboard gate
        run: bash scripts/check-taskboard.sh

      - name: Route file gate
        run: npm run check:route-files

      - name: Schema reference gate
        run: npm run check:schema-refs

      - name: Supabase boundary gate
        run: npm run check:supabase-boundaries

      - name: Database static regression gate
        run: npm run check:db-static

      - name: CRM regression contract
        run: python3 scripts/crm-regression.py --self-test

      - name: Lint baseline gate
        run: npm run lint:baseline

      - name: Workflow YAML validation
        run: npm run check:workflows

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Repository tests
        run: npm test

      - name: Build
        run: npm run build
  windows-checkout:
    name: Windows checkout and SPEC gate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Clone and checkout exact PR head
        shell: pwsh
        run: |
          $clonePath = Join-Path $env:RUNNER_TEMP "sam16-checkout"
          git -c "http.extraheader=AUTHORIZATION: bearer $env:GITHUB_TOKEN" clone --no-checkout "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)" $clonePath
          if ($LASTEXITCODE -ne 0) { throw "git clone failed" }
          git -C $clonePath -c "http.extraheader=AUTHORIZATION: bearer $env:GITHUB_TOKEN" fetch --no-tags origin $env:TARGET_SHA
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git -C $clonePath checkout --detach $env:TARGET_SHA
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
          $status = git -C $clonePath status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw "git status failed" }
          if ($status) { throw "worktree is not clean: $status" }
          bash "$clonePath/scripts/check-spec.sh"
          if ($LASTEXITCODE -ne 0) { throw "check-spec failed" }
