name: ci

on:
  pull_request:
    branches:
      - agent/saas-staging-isolation
  workflow_dispatch:
    inputs:
      validation_level:
        description: Validation level (use full before release)
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_ENV: test
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
  SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
  NEXT_PUBLIC_SENTRY_DSN: ''

jobs:
  validate:
    name: Repository validation
    # Repository validation uses only disposable/example credentials and a
    # disposable PostgreSQL container.  It must not depend on the staging host
    # being reachable or on that host's Docker socket policy.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Toolchain reproducibility gate
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: E2E secret and artifact gate
        run: npm run check:e2e-secrets

      - name: E2E secret gate negative regression
        run: node --test tests/security/e2e-secret-gate.test.mjs

      - name: E2E artifact isolation gate
        run: npm run check:e2e-artifacts

      - name: E2E artifact isolation gate negative regression
        run: node --test tests/security/e2e-artifact-isolation.test.mjs

      - name: Taskboard gate
        run: bash scripts/check-taskboard.sh

      - name: Route file gate
        run: npm run check:route-files

      - name: Schema reference gate
        run: npm run check:schema-refs

      - name: Supabase boundary self-test
        run: node scripts/check-supabase-boundaries.mjs --self-test

      - name: Supabase boundary gate
        run: npm run check:supabase-boundaries

      - name: Database static regression gate
        run: npm run check:db-static

      - name: SAM-20 disposable database apply and rollback gate
        run: npm run check:sam20-database

      - name: SAM-23 and SAM-80 commercial operations database gate
        run: npm run check:sam80-database

      - name: SAM-79 commercial control plane contract
        run: npm run check:sam79

      - name: SAM-61 active-profile milestone guard
        run: npm run check:sam61-active-profile-database

      - name: V4 migration rehearsal contract gate
        run: npm run check:v4-migration-rehearsal

      - name: SAM-82 retail catalog inventory and pricing database gate
        run: npm run check:sam82-database

      - name: CRM regression contract
        run: python3 scripts/crm-regression.py --self-test

      - name: Lint baseline gate
        run: npm run lint:baseline

      - name: Workflow YAML validation
        run: npm run check:workflows

      - name: Supply chain gate
        run: npm run check:supply-chain -- --accept-known

      - name: Database type source gate
        run: npm run check:database-types

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Repository tests
        # The suite contains multiple disposable PostgreSQL harnesses. Serialize
        # test files so hosted-runner memory pressure cannot stop one database
        # while another harness is applying or rolling back its schema.
        run: npm test -- --test-concurrency=1

      - name: Release hygiene regression
        run: node --test tests/release/*.test.mjs

      - name: Build
        if: ${{ inputs.validation_level == 'full' }}
        run: npm run build

      - name: Build worktree hygiene
        if: ${{ inputs.validation_level == 'full' }}
        run: |
          if test -n "$(git status --porcelain --untracked-files=all)"; then
            echo "Build left tracked or untracked worktree changes:"
            git status --short --untracked-files=all
            exit 1
          fi
          if test -e tsconfig.tsbuildinfo; then
            echo "Build recreated the forbidden root tsconfig.tsbuildinfo"
            exit 1
          fi
